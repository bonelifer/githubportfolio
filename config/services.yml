services:
    mundophpbb.githubportfolio.github_api:
        class: mundophpbb\githubportfolio\service\github_api
        arguments:
            - '@config'
            - '@config_text'
            - '@mundophpbb.githubportfolio.sync_lock'
            - '@cache.driver'

    mundophpbb.githubportfolio.controller.main:
        class: mundophpbb\githubportfolio\controller\main_controller
        arguments:
            - '@template'
            - '@user'
            - '@controller.helper'
            - '@mundophpbb.githubportfolio.github_api'
            - '@config'

    mundophpbb.githubportfolio.listener:
        class: mundophpbb\githubportfolio\event\main_listener
        arguments:
            - '@template'
            - '@controller.helper'
            - '@config'
            - '@user'
            - '@mundophpbb.githubportfolio.github_api'
        tags:
            - { name: event.listener }

    mundophpbb.githubportfolio.sync_lock:
        class: phpbb\lock\db
        arguments:
            - mundophpbb_githubportfolio_sync_lock
            - '@config'
            - '@dbal.conn'

    mundophpbb.githubportfolio.cron.sync:
        class: mundophpbb\githubportfolio\cron\task\sync
        arguments:
            - '@mundophpbb.githubportfolio.github_api'
        calls:
            - [set_name, [cron.task.mundophpbb.githubportfolio.sync]]
        tags:
            - { name: cron.task }
